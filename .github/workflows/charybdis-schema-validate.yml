name: Charybdis schema validation

on:
  push:
    paths:
      - "charybdis/schemas/**"
  pull_request:
    paths:
      - "charybdis/schemas/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install jsonschema
      - run: python3 charybdis/schemas/validate.py
